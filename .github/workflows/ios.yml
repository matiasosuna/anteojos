# Compila la app en una Mac de GitHub (no hace falta Xcode en la Mac de Matías).
# - En cada push: compila para el simulador (chequea que el código esté bien).
# - A mano ("Run workflow" con testflight = true): firma y sube a TestFlight.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Subir a TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROYECTO: app/CameraAccess.xcodeproj
  ESQUEMA: CameraAccess

jobs:
  compilar:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Secretos
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          cat > app/CameraAccess/Anteojos/Secretos.swift <<EOF
          enum Secretos {
            static let appToken = "${APP_TOKEN}"
          }
          EOF

      - name: Compilar (simulador)
        if: ${{ !inputs.testflight }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROYECTO" -scheme "$ESQUEMA" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | tail -n 80

      - name: Clave de App Store Connect
        if: ${{ inputs.testflight }}
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p build
          printf '%s' "$ASC_API_KEY_P8" > build/asc.p8

      - name: Archivar y subir a TestFlight
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$PWD/build/asc.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -project "$PROYECTO" -scheme "$ESQUEMA" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Anteojos.xcarchive \
            "${AUTH[@]}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -n 80
          xcodebuild -exportArchive \
            -archivePath build/Anteojos.xcarchive \
            -exportOptionsPlist app/ExportOptions.plist \
            -exportPath build/export \
            "${AUTH[@]}" | tail -n 80

      - name: Borrar clave
        if: ${{ always() }}
        run: rm -f build/asc.p8
